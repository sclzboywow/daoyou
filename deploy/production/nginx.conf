server {
    listen 80;
    server_name yzdoc.cn www.yzdoc.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name yzdoc.cn www.yzdoc.cn;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/yzdoc.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yzdoc.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    index index.html;
    client_max_body_size 32m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://challenges.cloudflare.com wss:; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:" always;

    location /api/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /internal/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(game|login|signup|admin|forgot-password|reset-password)(/|$) {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri @site_assets;
    }

    location ^~ /icons/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location @site_assets {
        root /usr/share/nginx/site;
        try_files $uri =404;
    }

    location ^~ /_astro/ {
        root /usr/share/nginx/site;
        try_files $uri =404;
    }

    location ^~ /pagefind/ {
        root /usr/share/nginx/site;
        try_files $uri =404;
    }

    location = /favicon.svg {
        root /usr/share/nginx/html;
        try_files /favicon.svg =404;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files /favicon.svg =404;
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        try_files /manifest.webmanifest =404;
    }

    location = /version.json {
        root /usr/share/nginx/html;
        default_type application/json;
        expires -1;
        try_files /version.json =404;
    }

    location / {
        root /usr/share/nginx/site;
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
