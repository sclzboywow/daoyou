name: daoyou-official

services:
  nats:
    image: docker.m.daocloud.io/library/nats:2.11-alpine
    container_name: daoyou-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - /home/ubuntu/daoyou-runtime/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data/jetstream
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok",
        ]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s

  app:
    image: ${DAOYOU_APP_IMAGE:?DAOYOU_APP_IMAGE is required}
    container_name: daoyou-hono
    restart: unless-stopped
    env_file:
      - /home/ubuntu/daoyou-runtime/app.env
    environment:
      BATTLE_SERVER_URL: http://battle:3100
    networks:
      default:
        aliases:
          - app
    depends_on:
      nats:
        condition: service_healthy
      battle:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health-check').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  battle:
    image: ${DAOYOU_BATTLE_IMAGE:?DAOYOU_BATTLE_IMAGE is required}
    container_name: daoyou-battle
    restart: unless-stopped
    env_file:
      - /home/ubuntu/daoyou-runtime/app.env
    environment:
      BATTLE_SERVER_PORT: 3100
    networks:
      default:
        aliases:
          - battle
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/healthz').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    container_name: daoyou-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/ubuntu/daoyou-runtime/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ubuntu/daoyou/dist-web:/usr/share/nginx/html:ro
      - /home/ubuntu/daoyou/dist-site:/usr/share/nginx/site:ro
      - /home/ubuntu/daoyou/certbot/www:/var/www/certbot:ro
      - /home/ubuntu/daoyou/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
      battle:
        condition: service_healthy

networks:
  default:
    external: true
    name: daoyou_default

volumes:
  nats-data:
