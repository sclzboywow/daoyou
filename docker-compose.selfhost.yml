name: daoyou

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: daoyou-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: daoyou
      POSTGRES_USER: daoyou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - daoyou_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daoyou -d daoyou"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: daoyou-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - daoyou_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
    image: daoyou-hono:local
    container_name: daoyou-hono
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://daoyou:${POSTGRES_PASSWORD}@postgres:5432/daoyou
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health-check').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  web:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    container_name: daoyou-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist-web:/usr/share/nginx/html:ro
      - ./dist-site:/usr/share/nginx/site:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging

volumes:
  daoyou_pg_data:
  daoyou_redis_data:
